# /etc/nginx/snippets/helios-security-headers.conf
#
# Security headers for the files nginx serves itself (voting booth, verifiers, static files).
# Django sets these headers on everything it serves (pages, and with Docker Compose also the
# booth and static files), but not on files nginx serves directly, so this snippet repeats
# them. Keep the policy in line with the CSP_* settings in settings.py.
#
# What the booth needs: inline scripts and onclick handlers ('unsafe-inline'), jTemplates and
# the JSON parser use eval ('unsafe-eval'), encryption in a web worker (worker-src 'self'),
# election data and the per-election colors from this server (connect-src, style-src 'self':
# /helios/elections/<uuid>/booth-theme.css), logos and fonts from this server (img-src,
# font-src 'self'), and the ballot is posted to the election's cast URL (form-action 'self').
#
# nginx drops the add_header lines of the server block in a location that has its own, so
# include this snippet in every location that serves files (see nginx-helios.conf).
# With CSP_REPORT_ONLY=1, use Content-Security-Policy-Report-Only instead (and add
# "; report-uri <CSP_REPORT_URI>" if set).

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# only with HSTS=1, as Django does for its pages:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
