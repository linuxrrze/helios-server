# /etc/nginx/sites-available/helios
# nginx runs as www-data; add it to group helios so it can reach the gunicorn socket:
#   usermod -aG helios www-data

server {
    listen 80;
    listen [::]:80;
    server_name vote.example.org www.vote.example.org;
    return 301 https://vote.example.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vote.example.org www.vote.example.org;

    ssl_certificate     /etc/ssl/helios/vote.example.org.fullchain.pem;
    ssl_certificate_key /etc/ssl/helios/vote.example.org.key;   # mode 0600, root
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    if ($host != "vote.example.org") { return 301 https://vote.example.org$request_uri; }

    client_max_body_size 10m;   # voter file uploads

    # static assets straight from the checkout (same mapping as urls.py). Django's security
    # headers (Content Security Policy etc.) don't apply to files nginx serves itself: the
    # snippet adds the same ones (nginx-helios-security-headers.conf; needed in each location).
    # The booth's colors come from Django (/helios/elections/<uuid>/booth-theme.css).
    location /static/auth/   { alias /opt/helios/helios-server/helios_auth/media/; expires 1d; include snippets/helios-security-headers.conf; }
    location /static/helios/ { alias /opt/helios/helios-server/helios/media/; expires 1d; include snippets/helios-security-headers.conf; }
    location /static/site/   { alias /opt/helios/site/static/; expires 1d; include snippets/helios-security-headers.conf; }   # SITE_STATIC_DIR, if used
    location /static/        { alias /opt/helios/helios-server/server_ui/media/; expires 1d; include snippets/helios-security-headers.conf; }
    location /booth/         { alias /opt/helios/helios-server/heliosbooth/; include snippets/helios-security-headers.conf; }
    location /verifier/      { alias /opt/helios/helios-server/heliosverifier/; include snippets/helios-security-headers.conf; }

    location / {
        proxy_pass http://unix:/run/helios/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
