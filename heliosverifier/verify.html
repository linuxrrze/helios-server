<script language="javascript">
// translate the static text of this page
function translate_page() {
  document.title = gettext("Helios Voting System -- Verifier");
  $('#banner').text(gettext("Helios Election Verifier"));
  $('#verifier_loading').text(gettext("loading verifier ..."));
  $('#election_url_label').text(gettext("Enter the Election URL:"));
  $('#start_button').val(gettext("start verification"));
}

$(document).ready(function() {
    translate_page();

    BigInt.setup(function() {
       $('#verifier_loading').hide();
       $('#verifier').show();
    }, function() {
       alert(gettext('sorry, in-browser verification requires Java Support at this time.'));
    });
});    

function result_append(str) {
    $('#results').append(str).append("<br />");
}

function pretty_result(result) {return result? gettext("VERIFIED") : gettext("FAIL");}

function load_ballots(election_url, ballot_list, ballots, final_callback) {
    // the ballots array is the place where we build up the list of ballots

    // end of the iteration?
    if (ballot_list.length == ballots.length) {
        final_callback(ballots);
        return;
    }
    
    result_append(interpolate(gettext("loading ballot for voter #%(num)s"), {'num': ballots.length + 1}, true));
        
    // get the next ballot
    $.get(election_url + "/ballots/" + ballot_list[ballots.length].uuid + '/last', function(result) {
        var new_ballot = jQuery.secureEvalJSON(result);
        ballots.push(new_ballot);
        if (new_ballot.vote == null)
          result_append(interpolate(gettext("no ballot for this voter #%(num)s"), {'num': ballots.length}, true));
        else
          result_append(interpolate(gettext("FOUND a ballot for voter #%(num)s"), {'num': ballots.length}, true));
        load_ballots(election_url, ballot_list, ballots, final_callback);
    });
}

// load the ballot list in increments of 50, for long ballots
function load_ballot_list(election_url, ballot_list, after, final_callback) {
    var url = election_url + "/voters/?limit=50";
    if (after)
        url+= "&after=" + after;
        
    $.get(url, function(result) {
        var new_ballot_list = jQuery.secureEvalJSON(result);

        // done, no more ballots?
        if (new_ballot_list.length == 0)
            return final_callback(ballot_list);
            
        // not done, add to the list
        ballot_list = ballot_list.concat(new_ballot_list);
        after = ballot_list[ballot_list.length - 1].uuid;
        
        // and iterate
        load_ballot_list(election_url, ballot_list, after, final_callback);
    });
}

function load_election_and_ballots(election_url) {
        
    result_append("<h3>" + gettext("Election") + "</h3>");
    result_append(gettext("loading election..."));

    var overall_result = true;
    
    // the hash will be computed within the setup function call now
    $.get(election_url, function(raw_json) {
        try {
            election = HELIOS.Election.fromJSONString(raw_json);
            result_append(interpolate(gettext("loaded election: %(name)s"), {'name': election.name}, true));
            result_append(interpolate(gettext("election fingerprint: %(hash)s"), {'hash': election.get_hash()}, true));

            var tally = [];

            $(election.questions).each(function(qnum, q) {
                if (q.tally_type != "homomorphic") {
                  result_append(gettext("PROBLEM: this election is not a straight-forward homomorphic-tally election. As a result, Helios cannot currently verify it."));
                  return;
                }

                tally[qnum] = $(q.answers).map(function(anum, a) {
                    return 1;
                });
            });

            result_append(gettext("loading list of voters..."));
            
            // load voter list
            load_ballot_list(election_url, [], null, function(ballot_list) {
                result_append(gettext("loaded voter list, now loading ballots for each.."));

                // load all ballots
                load_ballots(election_url, ballot_list, [], function(ballots) {
                    result_append("");
                    result_append("<h3>" + gettext("Ballots") + "</h3>");
                    // now load each ballot
                    $(ballots).each(function(i, cast_vote){

                        if (cast_vote.vote == null)
                          return;

                        var vote = HELIOS.EncryptedVote.fromJSONObject(cast_vote.vote, election);
                        result_append(interpolate(gettext("Voter #%(num)s"), {'num': i+1}, true));
                        result_append("-- UUID: " + cast_vote.voter_uuid);
                        result_append("-- " + interpolate(gettext("Ballot Tracking Number: %(hash)s"), {'hash': vote.get_hash()}, true));

                        vote.verifyProofs(election.public_key, function(answer_num, choice_num, result, choice) {
                            overall_result = overall_result && result;
                            if (choice_num != null) {
                                // keep track of tally
                                tally[answer_num][choice_num] = choice.multiply(tally[answer_num][choice_num]);

                                result_append(interpolate(gettext("Question #%(question)s, Option #%(option)s -- %(result)s"), {'question': answer_num+1, 'option': choice_num+1, 'result': pretty_result(result)}, true));
                            } else {
                                result_append(interpolate(gettext("Question #%(question)s OVERALL -- %(result)s"), {'question': answer_num+1, 'result': pretty_result(result)}, true));
                            }
                        });

                        result_append("");
                    });

                    // get the election result
                    $.get(election_url + "/result", function(result) {
                        var results = $.secureEvalJSON(result);

                        // get the trustees and proofs
                        $.get(election_url + "/trustees/", function(trustees_json) {
                           trustees = $.secureEvalJSON(trustees_json);

                           // create the Helios objects
                           trustees = $(trustees).map(function(i, trustee) {return HELIOS.Trustee.fromJSONObject(trustee)});

                           // the public key that we'll check
                           var combined_key = 1;

                           result_append("<h3>" + gettext("Trustees") + "</h3>");
                           // verify the keys
                           $(trustees).each(function(i, trustee) {
                              result_append(interpolate(gettext("Trustee #%(num)s: %(email)s"), {'num': i+1, 'email': trustee.email}, true));
                              // the server hashes the key as Python's json.dumps(sort_keys=True),
                              // so rebuild exactly that string: sorted keys, ", " and ": " separators
                              var pk = trustee.public_key.toJSONObject();
                              var pk_hash = b64_sha256('{"g": "' + pk.g + '", "p": "' + pk.p + '", "q": "' + pk.q + '", "y": "' + pk.y + '"}');
                              if (pk_hash == trustee.public_key_hash &&
                                  trustee.public_key.verifyKnowledgeOfSecretKey(trustee.pok, ElGamal.fiatshamir_dlog_challenge_generator)) {
                                  result_append(interpolate(gettext("-- PK %(hash)s -- VERIFIED."), {'hash': trustee.public_key_hash}, true));
                              } else {
                                  result_append(interpolate(gettext("==== ERROR for PK of trustee %(email)s"), {'email': trustee.email}, true));
                                  overall_result = false;
                              }

                              combined_key = trustee.public_key.multiply(combined_key);

                              result_append("");
                           });

                           // verify the combination of the keys into the final public key
                           if (combined_key.equals(election.public_key)) {
                               result_append(gettext("election public key CORRECTLY FORMED"));
                           } else {
                               result_append(gettext("==== ERROR, election public key doesn't match"));
                               overall_result = false;
                           }

                           result_append("<h3>" + gettext("Tally") + "</h3>");

                           $(tally).each(function(q_num, q) {
                               result_append(interpolate(gettext("Question #%(num)s: %(name)s"), {'num': q_num+1, 'name': election.questions[q_num].short_name}, true));
                               $(q).each(function(a_num, a) {
                                   var plaintext = new ElGamal.Plaintext(election.public_key.g.modPow(BigInt.fromInt(results[q_num][a_num]), election.public_key.p), election.public_key);

                                   var check = true;
                                   result_append(interpolate(gettext("Answer #%(num)s: %(answer)s - COUNT = %(count)s"), {'num': a_num + 1, 'answer': election.questions[q_num].answers[a_num], 'count': results[q_num][a_num]}, true));

                                   var decryption_factors = [];

                                   // go through the trustees' decryption factors and verify each one
                                   $(trustees).each(function(t_num, trustee) {
                                       if (trustee.public_key.verifyDecryptionFactor(a, trustee.decryption_factors[q_num][a_num],
                                                       trustee.decryption_proofs[q_num][a_num], ElGamal.fiatshamir_challenge_generator)) {
                                           result_append(interpolate(gettext("-- Trustee %(email)s: decryption factor verifies"), {'email': trustee.email}, true));
                                       } else {
                                           result_append(interpolate(gettext("==== ERROR with Trustee %(email)s: decryption factor does not verify"), {'email': trustee.email}, true));
                                           check= false;
                                           overall_result = false;
                                       }

                                       decryption_factors.push(trustee.decryption_factors[q_num][a_num]);
                                   });

                                   // recheck decryption factors
                                   var expected_value = election.public_key.g.modPow(BigInt.fromInt(results[q_num][a_num]), election.public_key.p);                        
                                   var recomputed_value = a.decrypt(decryption_factors).getM();
                                   if (expected_value.equals(recomputed_value)) {
                                   } else {
                                       check = false;
                                       overall_result = false;
                                   }

                                   result_append("-" + pretty_result(check));
                               });

                           });

                           result_append("<h3>" + gettext("FINAL RESULT") + "</h3>");

                           if (overall_result) {
                             result_append(gettext("ELECTION FULLY VERIFIED -- SUCCESS!"));
                           } else {
                             result_append(gettext("VERIFICATION FAILED"));
                           }
                        });
                    });
                });

            });
    } catch (error) {
        result_append("<p>" + gettext("It appears that you are trying to verify a private election.") + "</p>");
        result_append('<p>' + gettext('You can log in as a valid voter or log in as the election admin.') + '</p>');
        result_append('<a class="btn" href="' + election_url + '">' + gettext('Log in as a valid voter') + ' </a>');
        result_append('<a class="btn" href="/auth/?return_url=/verifier/verify.html?election_url=' + election_url + '">' + gettext('Log in as the election admin') + '</a>');
    }
    });
        
}

$(document).ready(function() {
   var election_url = $.query.get('election_url');
   $('#election_url').val(election_url); 
});
</script>

loading verifier ...

</div>
</div>
