{% load i18n login_icons %}{% if default_auth_system %}
<p>
<a class="small button" href="{% url "auth@start" system_name=default_auth_system %}?return_url={{return_url|urlencode}}">{% translate "Log in" %}</a></p>
{% else %}
{% for auth_system in enabled_auth_systems %}
{% if auth_system == "password" %}
{% else %}
<p>
    <a href="{{SECURE_URL_HOST}}{% url "auth@start" system_name=auth_system %}?return_url={{return_url|urlencode}}" style="font-size: 1.4em;">
<img style="height: 35px; border: 0px;" src="{{ auth_system|login_icon }}" alt="{{auth_system}}" /> {{auth_system}}
{% endif %}
</a>
</p>
{% endfor %}
{% endif %}
