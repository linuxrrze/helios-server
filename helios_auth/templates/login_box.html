{% load i18n login_icons %}{% if default_auth_system %}
<p>
<a class="small button" href="{% url "auth@start" system_name=default_auth_system %}?return_url={{return_url|urlencode}}">{% translate "Log in" %}</a></p>
{% else %}
<ul class="login-options">
{% for auth_system, login_message in auth_options %}
<li>
  <a class="login-option" href="{{SECURE_URL_HOST}}{% url "auth@start" system_name=auth_system %}?return_url={{return_url|urlencode}}">
    <img src="{{ auth_system|login_icon }}" alt="" /> <span>{{ login_message }}</span>
  </a>
</li>
{% endfor %}
</ul>
{% endif %}
