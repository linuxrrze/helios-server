# GitLab CI: full test suite on PostgreSQL, including the optional SAML extra.
# Mirrors .github/workflows/ci.yml (upstream), which does not run on GitLab.
# Keep the two in sync when upstream changes the workflow.
#
# Requires a runner with the Docker (or Kubernetes) executor, for `image:` and
# `services:`. Runs on every push (GitHub: push/PR to main/master only).
#
# Additions, not in the GitHub workflow: on branch pushes, the `build` stage
# builds the container image from the Dockerfile (with the SAML extra) and pushes
# it to this project's container registry; the `scan` stage checks it with Trivy.
# Run the pipeline on a schedule (Build > Pipeline schedules, e.g. weekly) to
# find newly published vulnerabilities in an unchanged image.

stages: [test, build, scan]

variables:
  IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

test:
  stage: test
  # GitHub: matrix python-version '3.13' via actions/setup-python
  image: python:3.13-bookworm
  services:
    # GitHub: matrix postgres-version '16'. GitLab waits for the service's
    # exposed port, which replaces the pg_isready health check.
    - name: postgres:16
      alias: postgres
  variables:
    # Passed to the postgres service container as well (same as GitHub's
    # services.postgres.env).
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: helios
    POSTGRES_HOST_AUTH_METHOD: trust
    # GitHub reaches the service on localhost; here it is the service alias.
    PGHOST: postgres
    PGUSER: postgres
    UV_CACHE_DIR: .uv-cache
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [.uv-cache]
  before_script:
    # python-ldap is built from source (gcc is already in the full python image)
    - apt-get update && apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev
    # GitHub: astral-sh/setup-uv
    - pip install uv
    - uv sync --extra saml
    - uv pip freeze
    # settings_ci.py hardcodes HOST 'localhost' (DATABASES ignores PGHOST);
    # point it at the service container. Block scalar because the command
    # contains ": ", and grep makes the job fail if the pattern ever stops matching.
    - |
      sed -i "s/'HOST': 'localhost'/'HOST': 'postgres'/" settings_ci.py
      grep -q "'HOST': 'postgres'" settings_ci.py
  script:
    - uv run python -Wall manage.py test -v 2 --settings=settings_ci

build-image:
  stage: build
  # Kaniko builds without a Docker daemon and without user namespaces, so it
  # works on an unprivileged runner (Buildah/Podman need CAP_SYS_ADMIN or
  # unshare(CLONE_NEWUSER), which unprivileged runners do not allow).
  # osscontainertools/kaniko is the maintained continuation of Google's kaniko
  # (archived in 2025). The -debug variant contains the shell GitLab needs.
  # Pinned by digest.
  image:
    name: ghcr.io/osscontainertools/kaniko:v1.29.0-debug@sha256:350929376b8a69afb1d8b362086c809e4ef6799fa1bcb317c2806ae1447b3845
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_BRANCH
  script:
    - mkdir -p /kaniko/.docker
    - >
      echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}"
      > /kaniko/.docker/config.json
    - >
      /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --build-arg "UV_EXTRAS=--extra saml"
      --label org.opencontainers.image.source="$CI_PROJECT_URL"
      --label org.opencontainers.image.revision="$CI_COMMIT_SHA"
      --destination "$IMAGE"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"

trivy:
  stage: scan
  # Pinned by digest (Trivy release images have been the target of a
  # supply-chain attack before).
  image:
    name: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    entrypoint: [""]
  needs: [build-image]
  rules:
    - if: $CI_COMMIT_BRANCH
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
    TRIVY_CACHE_DIR: .trivycache
    TRIVY_NO_PROGRESS: "true"
    # the venv is in the image, so this covers the Python packages as well as
    # the Debian packages of the base image
    TRIVY_SCANNERS: vuln
  cache:
    key: trivy
    paths: [.trivycache]
  script:
    # all findings, for GitLab's container scanning report (Secure > Vulnerability report)
    - trivy image --format template --template "@/contrib/gitlab.tpl" --output gl-container-scanning-report.json "$IMAGE"
    # readable summary in the job log (uses the DB downloaded above)
    - trivy image --skip-db-update --severity HIGH,CRITICAL "$IMAGE"
    # fail only for critical vulnerabilities that have a fix: those mean
    # updating a dependency or rebuilding on a newer base image
    - trivy image --skip-db-update --exit-code 1 --severity CRITICAL --ignore-unfixed --format table "$IMAGE" > /dev/null
  artifacts:
    when: always
    reports:
      container_scanning: gl-container-scanning-report.json
    paths: [gl-container-scanning-report.json]
