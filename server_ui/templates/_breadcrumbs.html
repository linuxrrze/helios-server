{% load i18n %}{% if crumbs %}
<nav class="breadcrumbs" aria-label="{% translate "Breadcrumb" %}">
  <ol>{% for label, url in crumbs %}
    <li>{% if url %}<a href="{{ url }}">{{ label }}</a>{% else %}<span aria-current="page">{{ label }}</span>{% endif %}</li>{% endfor %}
  </ol>
</nav>
{% endif %}
