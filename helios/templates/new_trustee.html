{% extends "helios/templates/cryptobase.html" %}
{% load i18n %}

{% block content %}
  <h2 class="title">{{election.name}} &mdash; {% translate "New Trustee" %} <span style="font-size:0.7em;">[<a href="{% url "election@trustees@view" election.uuid %}">{% translate "cancel" %}</a>]</span></h2>
  
<form method="post" action="">
<input type="hidden" name="csrf_token" value="{{csrf_token}}" />
{% translate "Name:" %} <input type="text" name="name" size="60" /><br /><br />
{% translate "Email:" %} <input type="text" name="email" size="60" /><br /><br />

<input class="button" type="submit" value="{% translate "Add Trustee" %}" />
</form>

{% endblock %}
