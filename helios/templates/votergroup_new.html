{% extends TEMPLATE_BASE %}
{% load i18n %}
{% block title %}{% translate "New voter group" %}{% endblock %}
{% block content %}
<h2 class="title">{% translate "Create a new voter group" %}</h2>

{% if error %}<p class="error" style="color: red;">{{error}}</p>{% endif %}

<form class="prettyform" action="" method="POST" id="create_votergroup_form">
  <input type="hidden" name="csrf_token" value="{{csrf_token}}" />
  <table class="pretty">
    {{votergroup_form.as_table}}
  </table>
  <div><label for="">&nbsp;</label><input type="submit" value="{% translate "Create &gt;&gt;" %}" id="next_button" /></div>
</form>

<a href="{% url "votergroup@administered" %}">{% translate "Back to voter groups" %}</a>
{% endblock %}
